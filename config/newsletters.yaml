# config/newsletters.yaml - newsletters lidas pelo RSS no run diário (Substack, beehiiv, sites).
#   profile: ia (seção Fronteira de IA, perfil geral) | saude (seção IA ∩ Saúde, perfil médico)
#   kind:    post (cada post é um item) | digest (cada edição traz várias notícias; o LLM separa uma a uma,
#            ≈ US$ 0,0005 por edição)
#   enabled: false deixa a newsletter listada sem ler
# As de saúde passam por um filtro de termos de IA (inglês e português) antes da triagem.
# Acrescentar um Substack (ou outro feed): sotawhat newsletters add https://exemplo.substack.com --profile saude
# Fora daqui: AlphaSignal e OpenAI (RSS em sotawhat/profiles.py), The Batch (sitemap) e a Rundown AI (Gmail,
# label newsletters/ai). Feeds conferidos em 2026-11-09.
newsletters:
  # ----- Fronteira de IA ------------------------------------------------------------------------------
  - name: import-ai
    url: https://importai.substack.com/feed
    profile: ia
    kind: digest
    enabled: true
    note: Jack Clark (Anthropic); pesquisa e política de IA, semanal
  - name: interconnects
    url: https://www.interconnects.ai/feed
    profile: ia
    kind: post
    enabled: true
    note: Nathan Lambert; modelos abertos, pós-treino e RL, 1–2 por semana
  - name: latent-space
    url: https://www.latent.space/feed
    profile: ia
    kind: post
    enabled: true
    note: engenharia de IA (swyx); ~5 por semana, entram as 2 mais novas por dia
  - name: understanding-ai
    url: https://www.understandingai.org/feed
    profile: ia
    kind: post
    enabled: true
    note: Timothy B. Lee; análise de modelos e mercado, semanal
  - name: one-useful-thing
