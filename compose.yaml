# compose.yaml — os dois serviços locais do sotawhat no Docker Desktop, cada um sobe pelo seu comando:
# - neo4j: espelho do grafo de entidades (SDD §6.3, D16). `sotawhat graph up` repassa NEO4J_PASSWORD,
#   NEO4J_HEAP_MAX e NEO4J_PAGECACHE do .env; a senha nunca fica neste arquivo.
# - ollama: o SLM local que responde às perguntas sobre o grafo (SDD §6.15). `sotawhat rag up` sobe o serviço
#   com a GPU e baixa o modelo de SLM_MODEL. Numa VPS sem GPU use compose.vps.yaml.
# As portas abrem só em 127.0.0.1, e os dados ficam em volumes nomeados (sotawhat_neo4j_data, sotawhat_ollama).
name: sotawhat
services:
  neo4j:
    image: neo4j:2026.10.1-community
    container_name: sotawhat-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env e rode sotawhat graph up}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  ollama:
    image: ollama/ollama:0.40.14
    container_name: sotawhat-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "${SLM_KEEP_ALIVE:-15m}"
      OLLAMA_CONTEXT_LENGTH: "${SLM_CONTEXT:-8192}"
    volumes:
      - ollama:/root/.ollama
    gpus: all
volumes:
  neo4j_data:
  ollama:
